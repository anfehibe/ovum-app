name: ovum
description: "OVUM 2026 - XXIX Congreso Latinoamericano de Avicultura"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0

  # UI / utilidades
  google_fonts: ^8.2.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

  # Persistencia local + formato
  shared_preferences: ^2.5.5
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# path_provider_foundation 2.5+ adoptó "native code assets" (objective_c.dylib)
# que rompe el build de iOS en Flutter 3.44. Se fija a la última versión previa.
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter_launcher_icons:
  image_path: "assets/logo/ovum_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#E8991C"
  image: assets/logo/ovum_splash.png
  android_12:
    color: "#E8991C"
    image: assets/logo/ovum_splash.png

flutter:
  uses-material-design: true

  assets:
    - assets/mock/
    - assets/images/
    - assets/logo/
